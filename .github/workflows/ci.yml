name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --locked --extra dev

      # ubuntu-latest runners ship without ffmpeg/ffprobe, which gates the
      # MP4/audiovisual tests (test_media_and_render.py, test_v03_contracts.py)
      # and drops coverage below the 90% gate. Installing ffmpeg makes those
      # tests run headless instead of skipping.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Lint
        run: uv run ruff check src scripts tests

      - name: Test suite with coverage gate
        run: uv run pytest tests/ --cov=src/duckrabbit --cov-report=term-missing --cov-fail-under=90

      - name: Validate scholarship (offline)
        run: uv run python scripts/validate_scholarship.py

      # DejaVu Sans is present on GitHub runners, so the figure font
      # resolution in src/duckrabbit/publication.py succeeds without
      # DUCKRABBIT_FONT_PATH. Digests are only comparable within one
      # platform/font (see README "Figure rendering environment").
      - name: Regenerate publication outputs
        run: uv run python -m duckrabbit publish --output-dir output --clean

      - name: Release audit
        run: uv run python -m duckrabbit audit --output-root output --release

      - name: Python 3.15 profiling smoke (no speed gate)
        if: matrix.python-version == '3.15'
        run: uv run python scripts/profile_workloads.py --workloads canonical video_metrics observer --iterations 1 --profile --memory --output-dir "$RUNNER_TEMP/duckrabbit-profile"

      - name: Build and exercise installed wheel
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/duckrabbit-dist"
          uv venv "$RUNNER_TEMP/duckrabbit-wheel-env"
          uv pip install --python "$RUNNER_TEMP/duckrabbit-wheel-env/bin/python" "$RUNNER_TEMP"/duckrabbit-dist/*.whl
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$RUNNER_TEMP/duckrabbit-wheel-env/bin/python" -c "from duckrabbit import generate, load_evidence_matrix, default_claim_registry; assert load_evidence_matrix()[0]; assert default_claim_registry(); assert generate('visual.duck_rabbit').width > 0"
